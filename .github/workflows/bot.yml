name: swing-bot

on:
  schedule:
    - cron: "0 22 * * 1-5"      # 22:00 UTC weekdays - after the US close, daily bars are final
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: swing-bot
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install yfinance pandas numpy
      - name: Run daily swing tick (whole universe)
        run: python swing_paper.py --once
      - name: Save state back to the repo
        run: |
          git config user.name  "swing-bot"
          git config user.email "swing-bot@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "state: $(date -u +%FT%TZ)"
          git push
